# Migrated from gup's ShellSpec e2e/spec/pin_spec.sh. Run with: make e2e
#
# Multi-command ShellSpec setups (install_fixture; gup pin >/dev/null; gup update
# >/dev/null) become sequential `run:` steps; only the final run's output is
# asserted. The `verify_mixed` shell function maps to separate `go version -m`
# runs with their own assertions (cleaner than the embedded grep helper).
# config_path = $XDG_CONFIG_HOME/gup/gup.json = home/.config/gup/gup.json.
version: "1"

suite:
  name: gup pin/unpin (offline)

scenarios:
  - name: records a pin in gup.json with schema_version 2
    env: &iso
      HOME: "${workdir}/home"
      XDG_CONFIG_HOME: "${workdir}/home/.config"
      GOBIN: "${workdir}/gobin"
      GOPATH: "${workdir}/gopath"
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - assert:
          exit_code: 0
          stdout:
            contains: "Pinned outdated to v1.0.0"
          file:
            path: home/.config/gup/gup.json
            exists: true
      - assert:
          file:
            path: home/.config/gup/gup.json
            contains: '"schema_version": 2'
      - assert:
          file:
            path: home/.config/gup/gup.json
            contains: '"channel": "pinned"'
      - assert:
          file:
            path: home/.config/gup/gup.json
            contains: '"version": "v1.0.0"'

  - name: accepts the tool@version form
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated@v1.0.0
      - assert:
          exit_code: 0
          stdout:
            contains: "Pinned outdated to v1.0.0"
          file:
            path: home/.config/gup/gup.json
            contains: '"channel": "pinned"'

  - name: refuses to pin a tool that is not managed by gup
    env: *iso
    steps:
      - run:
          command: gup pin not-installed v1.0.0
      - assert:
          exit_code: 1
          stderr:
            contains: "not managed by gup"

  - name: keeps a pinned tool at its version during gup update
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup update
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains:
              - gup.test/outdated
              - v1.0.0
      - assert:
          stdout:
            not_contains: v1.1.0

  - name: reinstalls a pinned tool at the pin when the installed version differs
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.1.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup update
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains: v1.0.0

  - name: updates an unpinned tool while a pinned tool stays put in the same run
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: go install gup.test/pinnable@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup update
      # pinned 'outdated' stays at v1.0.0...
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains: v1.0.0
      - assert:
          stdout:
            not_contains: v1.1.0
      # ...while unpinned 'pinnable' moved to v1.1.0.
      - run:
          command: go version -m gobin/pinnable
      - assert:
          stdout:
            contains: v1.1.0

  - name: allows the tool to update again after unpin
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup unpin outdated
      - run:
          command: gup update
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains: v1.1.0

  - name: unpin is idempotent for a tool that is not pinned
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup unpin outdated
      - assert:
          exit_code: 0
          stdout:
            contains: "not pinned"

  - name: reports a pinned tool at its version as pinned (JSON)
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup check --json
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"channel": "pinned"'
              - '"pinned_version": "v1.0.0"'
              - '"status": "pinned"'
      # A pin is never compared against @latest.
      - assert:
          stdout:
            contains: '"latest_version": ""'

  - name: reports pin-mismatch and suggests gup update when versions differ
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.1.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup check
      - assert:
          exit_code: 0
          stdout:
            contains:
              - pinned
              - "gup update"

  - name: exposes pin-mismatch in JSON
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.1.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup check --json
      - assert:
          stdout:
            contains:
              - '"status": "pin-mismatch"'
              - '"pinned_version": "v1.0.0"'
              - '"current_version": "v1.1.0"'

  - name: export preserves the pinned state and version
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup export --output
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"schema_version": 2'
              - '"channel": "pinned"'
              - '"version": "v1.0.0"'

  - name: import installs the exact pinned version
    env: *iso
    steps:
      - fixture:
          file: pinned.json
          content: |
            {"schema_version":2,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"v1.0.0","channel":"pinned"}]}
      - run:
          command: gup import --file "${workdir}/pinned.json"
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains: v1.0.0
      - assert:
          stdout:
            not_contains: v1.1.0

  - name: still reads an existing schema_version 1 config
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - fixture:
          file: cfg.json
          content: |
            {"schema_version":1,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"v1.0.0","channel":"latest"}]}
      - run:
          command: gup check --file "${workdir}/cfg.json" --json
      - assert:
          exit_code: 0
          stdout:
            contains: '"channel": "latest"'

  - name: fails fast on an invalid pinned config instead of installing @latest
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - fixture:
          file: cfg.json
          content: |
            {"schema_version":2,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"latest","channel":"pinned"}]}
      - run:
          command: gup check --file "${workdir}/cfg.json"
      - assert:
          exit_code: 1
          stderr:
            contains: pinned

  - name: fails fast on an unknown channel instead of treating it as latest
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - fixture:
          file: cfg.json
          content: |
            {"schema_version":1,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"v1.0.0","channel":"stable"}]}
      - run:
          command: gup check --file "${workdir}/cfg.json"
      - assert:
          exit_code: 1
          stderr:
            contains: "unknown channel"

  - name: rejects channel pinned under schema_version 1
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - fixture:
          file: cfg.json
          content: |
            {"schema_version":1,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"v1.0.0","channel":"pinned"}]}
      - run:
          command: gup check --file "${workdir}/cfg.json"
      - assert:
          exit_code: 1
          stderr:
            contains: pinned

  - name: keeps gup update --json valid with a pinned package
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      - run:
          command: gup update --json
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '"channel": "pinned"'
              - '"name": "outdated"'

  - name: rejects pinning to a channel keyword such as latest
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated latest
      # "Pinned" is a success message written to STDOUT, so the rejection is
      # asserted on STDOUT (absence) plus the concrete error on STDERR.
      - assert:
          exit_code: 1
          stdout:
            not_contains: "Pinned"
          stderr:
            contains: "channel keyword"

  - name: rejects specifying the version twice
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated@v1.0.0 v2.0.0
      - assert:
          exit_code: 1
          stderr:
            contains: "specify the version once"

  - name: pin fails fast on a malformed channel-source config
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - fixture:
          file: broken.json
          content: |
            {this is not valid json
      - run:
          command: gup pin outdated v1.0.0 --file "${workdir}/broken.json"
      - assert:
          exit_code: 1
          stdout:
            not_contains: "Pinned"
          stderr:
            contains: "is not valid JSON"

  - name: unpin reports a clear error for an empty tool name
    env: *iso
    steps:
      - run:
          command: gup unpin "@"
      - assert:
          exit_code: 1
          stderr:
            contains: "missing tool name"

  - name: unpin fails fast on a malformed channel-source config
    env: *iso
    steps:
      - fixture:
          file: broken.json
          content: |
            {this is not valid json
      - run:
          command: gup unpin outdated --file "${workdir}/broken.json"
      - assert:
          exit_code: 1
          stderr:
            contains: "is not valid JSON"

  # --- A pin must name one fixed version -----------------------------------
  # A pin is only a pin if 'go install <path>@<version>' can never resolve it to
  # different code later. Full versions (including prereleases) and
  # pseudo-versions qualify; branch names, commit hashes, abbreviated versions
  # (v1, v1.2) and version queries do not, because the go command resolves them
  # at install time.

  - name: pins a prerelease and gup update installs exactly that version
    env: *iso
    steps:
      - run:
          command: go install gup.test/pinnable@v1.0.0
      - run:
          command: gup pin pinnable v1.2.0-rc.1
      - assert:
          exit_code: 0
          stdout:
            contains: "Pinned pinnable to v1.2.0-rc.1"
          file:
            path: home/.config/gup/gup.json
            contains: '"version": "v1.2.0-rc.1"'
      - run:
          command: gup update
      - assert:
          exit_code: 0
      - run:
          command: go version -m gobin/pinnable
      - assert:
          stdout:
            contains: v1.2.0-rc.1

  - name: pins a commit by pseudo-version and gup update installs exactly that commit
    env: *iso
    steps:
      - run:
          command: go install gup.test/badmaintool@v1.0.0
      - run:
          command: gup pin badmaintool@v1.0.1-0.20240102000000-00000000000d
      - assert:
          exit_code: 0
          file:
            path: home/.config/gup/gup.json
            contains: '"version": "v1.0.1-0.20240102000000-00000000000d"'
      - run:
          command: gup update
      - assert:
          exit_code: 0
      - run:
          command: go version -m gobin/badmaintool
      - assert:
          stdout:
            contains: v1.0.1-0.20240102000000-00000000000d

  - name: "rejects a pin that does not name one fixed version (${version})"
    matrix:
      - { version: release, reason: "branch names" }
      - { version: abc1234, reason: "commit hash" }
      - { version: v1, reason: "abbreviated version" }
      - { version: v1.1, reason: "abbreviated version" }
      - { version: ">=v1.1.0", reason: "version query" }
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - run:
          command: gup pin outdated v1.0.0
      # Before the fix, v1 and v1.1 were saved and 'gup update' then installed
      # v1.1.0, the newest matching release, under the name of a pin.
      - run:
          command: gup pin outdated "${version}"
      - assert:
          exit_code: 1
          stdout:
            not_contains: "Pinned"
          stderr:
            contains:
              - '"${version}"'
              - ${reason}
              - "full version such as v1.2.3"
              - "pseudo-version"
          # Neither gup.json nor the installed binary is touched.
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          file:
            path: home/.config/gup/gup.json
            contains: '"version": "v1.0.0"'
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains: v1.0.0
            not_contains: v1.1.0

  - name: "gup update fails on a hand-edited pin that can move instead of installing it (${version})"
    matrix:
      - { version: v1 }
      - { version: release }
    env: *iso
    steps:
      - run:
          command: go install gup.test/outdated@v1.0.0
      - fixture:
          file: home/.config/gup/gup.json
          content: |
            {"schema_version":2,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"${version}","channel":"pinned"}]}
      - run:
          command: gup update
      - assert:
          exit_code: 1
          stderr:
            contains:
              - '"outdated"'
              - '"${version}"'
              - "full version such as v1.2.3"
              - "pseudo-version"
              - 'set its "channel" to "latest" to unpin it'
          # No install, no fallback to @latest, and no automatic unpin: the
          # config and $GOBIN are exactly as they were. Only the state-lock files
          # and the go command's telemetry counters may appear.
          changes:
            created: []
            modified: []
            deleted: []
            ignore: &lock_noise ["**/.gup.lock", "**/gup.json.lock", "**/go/telemetry/**"]
      - run:
          command: go version -m gobin/outdated
      - assert:
          stdout:
            contains: v1.0.0
            not_contains: v1.1.0

  - name: "gup import fails on a hand-edited pin that can move instead of installing it (${version})"
    matrix:
      - { version: v1.1 }
      - { version: main-branch }
    env: *iso
    steps:
      - fixture:
          file: pinned.json
          content: |
            {"schema_version":2,"packages":[{"name":"outdated","import_path":"gup.test/outdated","version":"${version}","channel":"pinned"}]}
      - run:
          command: gup import --file "${workdir}/pinned.json"
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "pinned.json"
              - '"outdated"'
              - '"${version}"'
              - "pseudo-version"
          changes:
            created: []
            modified: []
            deleted: []
            ignore: *lock_noise
      - assert:
          file:
            path: gobin/outdated
            exists: false
