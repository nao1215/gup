# Exercises 'gup completion' for every shell plus --install against the real
# binary. The per-shell switch in completion.go and the file-deploying install
# path (internal/completion) were previously only unit-tested; driving the CLI
# here measures the code an end user actually runs. Run with: make e2e
version: "1"

suite:
  name: gup completion (offline)

scenarios:
  - name: prints bash completion to STDOUT
    env: &iso
      HOME: "${workdir}/home"
      XDG_CONFIG_HOME: "${workdir}/home/.config"
      GOBIN: "${workdir}/gobin"
      GOPATH: "${workdir}/gopath"
    steps:
      - run:
          command: gup completion bash
      - assert:
          exit_code: 0
          stdout:
            contains: "# bash completion V2 for gup"

  - name: prints fish completion to STDOUT
    env: *iso
    steps:
      - run:
          command: gup completion fish
      - assert:
          exit_code: 0
          stdout:
            contains: "fish completion for gup"

  - name: prints zsh completion to STDOUT
    env: *iso
    steps:
      - run:
          command: gup completion zsh
      - assert:
          exit_code: 0
          stdout:
            contains: "#compdef gup"

  - name: prints powershell completion to STDOUT
    env: *iso
    steps:
      - run:
          command: gup completion powershell
      - assert:
          exit_code: 0
          stdout:
            contains: "Register-ArgumentCompleter"

  - name: rejects an unknown shell name
    env: *iso
    steps:
      - run:
          command: gup completion tcsh
      - assert:
          exit_code: 1
          stderr:
            contains: "invalid argument"

  - name: guidance is printed when neither a shell nor --install is given
    env: *iso
    steps:
      - run:
          command: gup completion
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "requires a shell name"
              - "--install"

  - name: --install writes shell completion files under the user config paths
    env: *iso
    steps:
      - run:
          command: gup completion --install
      - assert:
          exit_code: 0
      # bash goes under $HOME/.local/share (XDG_DATA_HOME unset), fish under
      # $XDG_CONFIG_HOME, zsh under $HOME/.zsh - proving all three were deployed.
      - assert:
          file:
            path: home/.local/share/bash-completion/completions/gup
            exists: true
      - assert:
          file:
            path: home/.config/fish/completions/gup.fish
            exists: true
      - assert:
          file:
            path: home/.zsh/completion/_gup
            exists: true

  - name: --install rejects a shell argument
    env: *iso
    steps:
      - run:
          command: gup completion --install bash
      - assert:
          exit_code: 1
          stderr:
            contains: "cannot be used with shell argument"

  # The scenarios below drive cobra's hidden __complete command - exactly what a
  # shell runs on <TAB>. gup prints the candidates on STDOUT and the directive
  # name ("ShellCompDirectiveNoFileComp", ...) on STDERR, so both the offered
  # names and the file-completion behavior are asserted against the real binary.

  - name: migrate completes directories while BEFORE_PATH and AFTER_PATH are typed
    env: *iso
    steps:
      - run:
          command: gup __complete migrate ""
      - assert:
          exit_code: 0
          stderr:
            contains: ShellCompDirectiveFilterDirs
      # The second positional argument is a directory too.
      - run:
          command: gup __complete migrate "${workdir}/before" ""
      - assert:
          exit_code: 0
          stderr:
            contains: ShellCompDirectiveFilterDirs

  - name: migrate completes BINARY from BEFORE_PATH instead of the current GOBIN
    env: *iso
    steps:
      # outdated lives only under BEFORE_PATH, uptodate only under the current
      # $GOBIN. migrate reinstalls what BEFORE_PATH holds, so only outdated is a
      # legal BINARY argument here.
      - run:
          command: go install gup.test/outdated@v1.0.0
          env:
            GOBIN: "${workdir}/before"
      - run:
          command: go install gup.test/uptodate@v1.0.0
      - run:
          command: gup __complete migrate "${workdir}/before" "${workdir}/after" ""
      - assert:
          exit_code: 0
          stdout:
            contains: outdated
            not_contains: uptodate
          stderr:
            contains: ShellCompDirectiveNoFileComp
      # A typed prefix that only the $GOBIN binary matches must stay empty.
      - run:
          command: gup __complete migrate "${workdir}/before" "${workdir}/after" up
      - assert:
          exit_code: 0
          stdout:
            not_contains: uptodate

  - name: migrate offers no BINARY when BEFORE_PATH does not exist yet
    env: *iso
    steps:
      - run:
          command: go install gup.test/uptodate@v1.0.0
      - run:
          command: gup __complete migrate "${workdir}/no-such-dir" "${workdir}/after" ""
      - assert:
          exit_code: 0
          stdout:
            not_contains: uptodate
          stderr:
            contains: ShellCompDirectiveNoFileComp

  - name: pin completes a binary for TOOL but not for VERSION
    env: *iso
    steps:
      - run:
          command: go install gup.test/pinnable@v1.0.0
      - run:
          command: gup __complete pin ""
      - assert:
          exit_code: 0
          stdout:
            contains: pinnable
      # The second argument is a VERSION: offering a binary name there would be
      # wrong, and cobra keeps calling the completion past the argument maximum.
      - run:
          command: gup __complete pin pinnable ""
      - assert:
          exit_code: 0
          stdout:
            not_contains: pinnable
          stderr:
            contains: ShellCompDirectiveNoFileComp

  - name: unpin completes one binary and nothing beyond it
    env: *iso
    steps:
      - run:
          command: go install gup.test/pinnable@v1.0.0
      - run:
          command: gup __complete unpin ""
      - assert:
          exit_code: 0
          stdout:
            contains: pinnable
      - run:
          command: gup __complete unpin pinnable ""
      - assert:
          exit_code: 0
          stdout:
            not_contains: pinnable
          stderr:
            contains: ShellCompDirectiveNoFileComp

  - name: --timeout completes no file name
    env: *iso
    steps:
      # A duration is not a path, so the shell must not fall back to file
      # completion (which is what ShellCompDirectiveDefault would request).
      - run:
          command: gup __complete update --timeout ""
      - assert:
          exit_code: 0
          stderr:
            contains: ShellCompDirectiveNoFileComp
            not_contains: ShellCompDirectiveDefault
      - run:
          command: gup __complete migrate --timeout ""
      - assert:
          exit_code: 0
          stderr:
            contains: ShellCompDirectiveNoFileComp
            not_contains: ShellCompDirectiveDefault
