# Exercises gup's state lock against real gup processes. Everything else about
# the lock is unit-tested, but mutual exclusion is a property BETWEEN processes:
# a lock that works perfectly in one process and not across two looks identical
# from the inside. These scenarios drive the built binary, and the ones that
# assert a refusal have a live process genuinely holding the lock.
#
# What changed, and why the specs look different from a lock-file suite: gup's
# lock is the operating system's (flock on Unix, LockFileEx on Windows), taken on
# a descriptor the holder keeps open. So a lock FILE planted by a fixture holds
# nothing at all, and gup is RIGHT to walk straight past it - there is no
# staleness rule to age it out and nothing for a user to delete. Contention here
# is therefore staged by a process, never by a file.
#
# Two kinds of holder appear below.
#
#   lockholder  a small helper (e2e/lockholder) that takes one lock with gup's
#               own lockfile package and holds it until it is killed. It is what
#               makes a scenario deterministic.
#   gup update  a real gup, made to sit still: it locks $GOBIN and gup.json in
#               sorted path order, so with directories named aaa-gobin and
#               zzz-config it takes the $GOBIN lock first and then blocks on the
#               config lock that lockholder is holding. The $GOBIN lock the
#               probes contend with is thus held by a genuine gup process, with
#               no sleep and no dependence on how long an install takes.
#
# GUP_LOCK_WAIT shortens the acquisition timeout so the probes fail in
# milliseconds instead of the shipped three seconds.
#
# Run with: make e2e
version: "1"

suite:
  name: gup concurrency lock (offline)

scenarios:
  - name: with nothing holding the lock a mutating command runs normally
    env: &holder_env
      HOME: "${workdir}/home"
      XDG_CONFIG_HOME: "${workdir}/zzz-config"
      GOBIN: "${workdir}/aaa-gobin"
      GOPATH: "${workdir}/gopath"
      # Long enough that the holder is still blocked while the probes run.
      GUP_LOCK_WAIT: "20s"
    steps:
      # gup locks a directory only once it exists, so $GOBIN is materialized
      # first. gup skips dot-prefixed entries, so the placeholder is invisible.
      - fixture: &empty_gobin
          file: aaa-gobin/.keep
          content: "placeholder so $GOBIN exists"
      - run:
          command: gup remove no-such-tool
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      # The control case for the scenario below. With nothing holding the $GOBIN
      # lock, this fails on the missing binary rather than on the lock -- without
      # it, "the second process was refused" could pass for the wrong reason.
      - assert:
          exit_code: 1
          stderr:
            contains: "no such file or directory"
            not_contains: "another gup process is already running"

  - name: a lock file left behind by an earlier run blocks nothing
    # The clearest statement of what the lock now is. This file carries a
    # complete owner record naming a live PID on a live machine, and it holds
    # nothing: the process that wrote it is not holding the kernel lock, so the
    # next gup takes it without waiting, without judging the file's age, and
    # without anybody having to delete anything.
    env: *holder_env
    steps:
      - fixture: *empty_gobin
      - fixture:
          file: aaa-gobin/.gup.lock
          content: |
            {"pid":1,"host":"some-other-machine","command":"update","acquired":"2026-01-01T00:00:00Z"}
      - run:
          command: gup remove no-such-tool
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      - assert:
          exit_code: 1
          stderr:
            contains: "no such file or directory"
            not_contains: "another gup process is already running"

  - name: two gup processes cannot hold the same $GOBIN lock
    env: *holder_env
    services:
      # The config lock, held for real, is what keeps the gup below sitting on
      # the $GOBIN lock instead of finishing.
      - &config_holder
        name: config-holder
        command: lockholder -lock ${workdir}/zzz-config/gup/gup.json.lock -ready ${workdir}/config-holder.ready
        env: *holder_env
        ready:
          file: config-holder.ready
          timeout: 20s
      - name: holder
        command: gup update
        env: *holder_env
        ready:
          # The holder has taken the $GOBIN lock once this file exists; it is
          # then blocked on the config lock for the rest of its wait.
          file: aaa-gobin/.gup.lock
          timeout: 20s
    steps:
      - fixture: *empty_gobin
      - run:
          command: gup remove no-such-tool
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      - assert:
          exit_code: 1
          stderr:
            contains: "another gup process is already running"
            # The message must never send a user to delete the file: the lock is
            # the kernel's, so the file is not what is in their way.
            not_contains: "Delete it by hand"
      # The lock does not block what it has no reason to block: reading is safe
      # against an atomic write, so `list` must not queue behind an update.
      - run:
          command: gup list
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      - assert:
          exit_code: 0
      # A dry run changes nothing, so it locks nothing.
      - run:
          command: gup update --dry-run
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      - assert:
          exit_code: 0
      # ...and neither does an export that only prints.
      - run:
          command: gup export --output
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      - assert:
          exit_code: 0

  - name: a lock held by a killed gup is free the moment that process is
    # SIGKILL runs no cleanup, so the holder's lock file outlives it. There is
    # nothing to reclaim: the kernel dropped the lock as it reaped the process,
    # so the next gup walks in at once. A scheme that had to judge the leftover
    # file would make one interrupted update block the tool until a timer said
    # otherwise.
    # Skipped on Windows: atago delivers POSIX signals to a process group, which
    # Windows has no equivalent for. The same handover is unit-tested natively
    # there (TestAcquire_takesTheLockAsSoonAsAKilledHolderIsGone runs on Windows
    # CI, killing a real child process).
    skip:
      os: windows
    env: *holder_env
    services:
      - *config_holder
      - name: holder
        command: gup update
        env: *holder_env
        ready:
          file: aaa-gobin/.gup.lock
          timeout: 20s
    steps:
      - fixture: *empty_gobin
      - signal:
          service: holder
          signal: KILL
          wait:
            timeout: 10s
      - assert:
          file:
            path: aaa-gobin/.gup.lock
            exists: true
      - run:
          command: gup remove no-such-tool
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      # It reached the command instead of the lock.
      - assert:
          exit_code: 1
          stderr:
            contains: "no such file or directory"
            not_contains: "another gup process is already running"

  - name: an interrupted gup holds its lock until the process is gone
    # Releasing the lock from a signal handler looks tidy and is not safe: it
    # frees the resource while the interrupted command is still installing
    # binaries and rewriting gup.json on its way out, so a gup started in that
    # moment runs alongside it. gup therefore holds the lock until the process
    # ends, and needs no handler to give it up - the kernel does that as the
    # process dies.
    # Skipped on Windows: atago delivers POSIX signals to a process group, which
    # Windows has no equivalent for.
    skip:
      os: windows
    env: *holder_env
    services:
      - *config_holder
      - name: holder
        command: gup update
        env: *holder_env
        ready:
          file: aaa-gobin/.gup.lock
          timeout: 20s
    steps:
      - fixture: *empty_gobin
      - signal:
          service: holder
          signal: INT
          wait:
            timeout: 10s
      # Nothing raced the process to the file: it is exactly where its owner
      # left it, holding nothing.
      - assert:
          file:
            path: aaa-gobin/.gup.lock
            exists: true
      - run:
          command: gup remove no-such-tool
          env:
            <<: *holder_env
            GUP_LOCK_WAIT: "200ms"
      - assert:
          exit_code: 1
          stderr:
            contains: "no such file or directory"
            not_contains: "another gup process is already running"

  - name: gup refuses to remove its own lock file
    # `gup remove .gup.lock --force` used to delete the lock of the command
    # running it. The kernel lock survived - it lives on an open descriptor, not
    # on a name - so nothing looked wrong, and the next gup found the name free,
    # created its own file there and locked that instead: two commands rewriting
    # one $GOBIN, each certain it had it to itself.
    env: &iso
      HOME: "${workdir}/home"
      XDG_CONFIG_HOME: "${workdir}/config-a"
      GOBIN: "${workdir}/gobin"
      GOPATH: "${workdir}/gopath"
      GUP_LOCK_WAIT: "200ms"
    steps:
      - fixture:
          file: gobin/.keep
          content: "placeholder so $GOBIN exists"
      - run:
          command: gup remove --force .gup.lock
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "gup's own lock file"
      # The command took that lock while it ran, so the file is there - and it is
      # still there, which is the point.
      - assert:
          file:
            path: gobin/.gup.lock
            exists: true

  - name: processes sharing a $GOBIN contend even from different config homes
    # $GOBIN and XDG_CONFIG_HOME move independently: a per-project configuration
    # directory still shares one $GOBIN with every other project. A lock derived
    # from the configuration directory would not serialize these two at all.
    env: *iso
    services:
      - name: gobin-holder
        command: lockholder -lock ${workdir}/gobin/.gup.lock -ready ${workdir}/gobin-holder.ready
        env: *iso
        ready:
          file: gobin-holder.ready
          timeout: 20s
    steps:
      - run:
          command: gup remove no-such-tool
          env:
            <<: *iso
            # A completely different configuration directory, same $GOBIN.
            XDG_CONFIG_HOME: "${workdir}/config-b"
      - assert:
          exit_code: 1
          stderr:
            contains: "another gup process is already running"

  - name: processes writing the same --file contend even from different config homes
    # The lock follows the file the command actually writes, so two processes
    # pointed at one shared gup.json serialize regardless of where their own
    # configuration lives.
    env: *iso
    services:
      - name: file-holder
        command: lockholder -lock ${workdir}/shared/gup.json.lock -ready ${workdir}/file-holder.ready -command pin
        env: *iso
        ready:
          file: file-holder.ready
          timeout: 20s
    steps:
      - fixture:
          file: shared/gup.json
          content: |
            {"schema_version": 1, "packages": []}
      - run:
          command: gup pin somebinary v1.0.0 --file ${workdir}/shared/gup.json
          env:
            <<: *iso
            XDG_CONFIG_HOME: "${workdir}/config-b"
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "another gup process is already running"
              # The holder is named concretely, down to the subcommand it is
              # running, because "resource unavailable" tells a user nothing.
              - "gup pin"

  - name: a corrupt lock file is overwritten rather than obeyed
    # A lock file truncated by a crash used to be a puzzle: unattributable, so it
    # had to block while fresh and be reclaimed once stale. It is not a puzzle
    # any more. Nobody holds the lock, so gup takes it and writes its own record
    # over the rubbish.
    env: *iso
    steps:
      - fixture:
          file: gobin/.gup.lock
          content: "{this is not json"
      - run:
          command: gup remove no-such-tool
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "no such file or directory"
            not_contains: "another gup process is already running"

  - name: the lock file is not mistaken for an installed binary
    # The $GOBIN lock lives in $GOBIN and is never deleted, so it is there for
    # every listing gup ever prints. gup skips dot-prefixed entries, so it must
    # never appear as a tool - a lock that shows up in `gup list` invites a user
    # to remove it.
    env: *iso
    steps:
      - run:
          command: go install gup.test/uptodate@v1.0.0
          env: *iso
      # A mutating command, so the lock file is really in $GOBIN when the
      # listing walks it. `list` takes no lock of its own and would otherwise
      # never meet one.
      - run:
          command: gup remove no-such-tool
          env: *iso
      - assert:
          file:
            path: gobin/.gup.lock
            exists: true
      - run:
          command: gup list
          env: *iso
      - assert:
          exit_code: 0
          stdout:
            contains: uptodate
            not_contains: "gup.lock"

  - name: a released lock leaves an empty file and the next command runs
    # The file outlives the lock on purpose: deleting a file another process may
    # already have opened is what would let two gups lock two different files at
    # one path. What must not outlive the lock is the record naming its holder,
    # or a waiter would report a process that has already finished.
    env: *iso
    steps:
      - fixture:
          file: gobin/.keep
          content: "placeholder so $GOBIN exists"
      - run:
          command: gup remove no-such-tool
          env: *iso
      - assert:
          exit_code: 1
      - assert:
          file:
            path: gobin/.gup.lock
            exists: true
            size: 0
      - run:
          command: gup remove no-such-tool
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            not_contains: "another gup process is already running"

  - name: a symlinked gup.json contends with the file it points at
    # Dotfile managers (stow, chezmoi, yadm) link gup.json into place, and gup
    # writes through the link so the link survives. The lock has to follow the
    # write: one beside the LINK would let --file link/gup.json and
    # --file real/gup.json take two different locks on one file and never
    # contend, which is the collision a resource-scoped lock exists to catch.
    # Skipped on Windows, where creating a symlink needs privileges a test
    # runner should not assume.
    skip:
      os: windows
    env: *iso
    services:
      - name: real-holder
        command: lockholder -lock ${workdir}/real/gup.json.lock -ready ${workdir}/real-holder.ready -command pin
        env: *iso
        ready:
          file: real-holder.ready
          timeout: 20s
    steps:
      - fixture:
          file: real/gup.json
          content: |
            {"schema_version": 1, "packages": []}
      - fixture:
          file: link/gup.json
          symlink: "${workdir}/real/gup.json"
      # A lock on the file the link points at, held by a live process. Reaching
      # it through the link must contend with it.
      - run:
          command: gup pin no-such-tool v1.0.0 --file ${workdir}/link/gup.json
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "another gup process is already running"
      # update writes the config through the same link, and used to lock the
      # link's own neighbor instead of the file: a pin on the real path and an
      # update on the link would both have been let through.
      - run:
          command: gup update --file ${workdir}/link/gup.json
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "another gup process is already running"

  - name: a lock path that is a symlink is refused, and its target is untouched
    # gup truncates its lock file to record who holds it. With the lock path
    # replaced by a link, that record used to be written straight THROUGH the
    # link - emptying whatever it pointed at, and reporting success. The refusal
    # comes from the open itself (O_NOFOLLOW, FILE_FLAG_OPEN_REPARSE_POINT), not
    # from a check something could race, and gup leaves the link where it is
    # rather than replacing it.
    # Skipped on Windows, where creating a symlink needs privileges a test
    # runner should not assume.
    skip:
      os: windows
    env: *iso
    steps:
      - fixture:
          file: precious.txt
          content: "the file the lock path points at"
      - fixture:
          file: shared/gup.json
          content: |
            {"schema_version": 1, "packages": []}
      - fixture:
          file: shared/gup.json.lock
          symlink: "${workdir}/precious.txt"
      - run:
          command: gup export --file ${workdir}/shared/gup.json
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "symbolic link"
      # The whole point: the file the link names comes out byte for byte intact.
      - assert:
          file:
            path: precious.txt
            contains: "the file the lock path points at"

  - name: migrate given one directory under two names takes one lock
    # BEFORE_PATH and AFTER_PATH used to be deduplicated as path STRINGS, so a
    # symlink pointing one at the other put the same file in the set twice: gup
    # took the kernel lock, asked the kernel for that same file again on a second
    # descriptor, waited out its whole timeout, and reported ITSELF as another
    # gup process. The command could never succeed. Locks are deduplicated by the
    # identity the filesystem gives the file, so the two names are one lock.
    # Skipped on Windows, where creating a symlink needs privileges a test
    # runner should not assume.
    skip:
      os: windows
    env: *iso
    steps:
      - fixture:
          file: old-gobin/.keep
          content: "placeholder so BEFORE_PATH exists"
      - fixture:
          file: alias
          symlink: "${workdir}/old-gobin"
      - run:
          command: gup migrate ${workdir}/old-gobin ${workdir}/alias
          env: *iso
      - assert:
          stderr:
            not_contains: "another gup process is already running"

  - name: a migration that cannot run leaves no AFTER_PATH behind
    # Taking the lock CREATES AFTER_PATH, because a destination that does not
    # exist yet is exactly when two migrations are most likely to collide. That
    # must not happen for a migration that is going to be rejected: failing on
    # BEFORE_PATH and still leaving a new directory on the user's disk is a
    # command that half ran.
    env: *iso
    steps:
      - run:
          command: gup migrate ${workdir}/no-such-gobin ${workdir}/new-gobin
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "BEFORE_PATH does not exist"
      - assert:
          dir:
            path: new-gobin
            exists: false

  - name: migrate contends over the directory it reads, not only the one it writes
    # What migrate installs into AFTER_PATH is derived from what it read in
    # BEFORE_PATH, so a gup changing BEFORE_PATH mid-scan produces a migration of
    # a tool set that never existed. Locking only the destination left the source
    # open to exactly that.
    env: *iso
    services:
      - name: source-holder
        command: lockholder -lock ${workdir}/old-gobin/.gup.lock -ready ${workdir}/source-holder.ready -command migrate
        env: *iso
        ready:
          file: source-holder.ready
          timeout: 20s
    steps:
      - fixture:
          file: old-gobin/.keep
          content: "placeholder so BEFORE_PATH exists"
      - fixture:
          file: new-gobin/.keep
          content: "placeholder so AFTER_PATH exists"
      - run:
          command: gup migrate ${workdir}/old-gobin ${workdir}/new-gobin
          env: *iso
      - assert:
          exit_code: 1
          stderr:
            contains: "another gup process is already running"

  - name: export locks a $GOBIN that does not exist yet by creating it
    # Whether $GOBIN exists is exactly what another gup can change: an import
    # creates it and fills it while an export walks it. An export that skipped
    # the lock because the directory was missing would write what it found -
    # nothing, or half an install - over a gup.json describing a complete tool
    # set, and an empty environment is a normal first run for export, so that
    # overwrite is silent.
    #
    # A lock file lives inside the directory it guards, so guarding a $GOBIN that
    # is not there means creating it. That is the observable part of the rule,
    # and the reason this scenario watches for a directory rather than for a
    # refusal: the interleaving itself is a race no spec can stage.
    env: &fresh
      HOME: "${workdir}/home"
      XDG_CONFIG_HOME: "${workdir}/config"
      GOBIN: "${workdir}/unborn-gobin"
      GOPATH: "${workdir}/gopath"
      GUP_LOCK_WAIT: "200ms"
    steps:
      - run:
          command: gup export
          env: *fresh
      - assert:
          exit_code: 0
      - assert:
          dir:
            path: unborn-gobin
            exists: true
      # The lock it took is released, and its file stays: an empty name for the
      # next command's lock to hang on, holding nothing in the meantime.
      - assert:
          file:
            path: unborn-gobin/.gup.lock
            exists: true
            size: 0
