version: 2
project_name: gup
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
    - go generate ./...
    - ./scripts/completions.sh
builds:
  - main: .
    ldflags:
      - -s -w -X github.com/nao1215/gup/internal/cmdinfo.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # The supported architectures are stated rather than inherited. GoReleaser's
    # default goarch list also builds 386, which gup has never claimed to
    # support, never smoke-tested, and never documented: a 32-bit artifact
    # appeared on every release page purely because nothing here said otherwise.
    # amd64 and arm64 are the two the README, the website, and
    # scripts/smoke_artifacts.sh all name, so they are the two that get built -
    # and every downstream manifest (archives, nfpms, winget, brew) is
    # generated from exactly this set.
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
    - completions/*
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
# Curated release notes: a short human summary first, then changes grouped by
# user-facing category (instead of a raw commit dump). See issue #283.
release:
  header: |
    ## gup {{ .Tag }}

    Fast parallel updater and manager for binaries installed with `go install`.

    Install or upgrade, then see the grouped highlights below. Every artifact is
    signed and ships with an SBOM and build provenance — see
    [Verifying release integrity](https://github.com/nao1215/gup#verifying-release-integrity).
  footer: |
    **Full changelog**: https://github.com/nao1215/gup/compare/{{ .PreviousTag }}...{{ .Tag }}
changelog:
  sort: asc
  use: github
  groups:
    - title: "Breaking changes"
      regexp: '^.*?[a-zA-Z]+(\(.+\))??!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^tests?(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "Merge pull request"
      - "Merge branch"
# Software Bill of Materials for every release archive (issue #285).
sboms:
  - artifacts: archive
# Keyless artifact signing with cosign. Signing the checksums file transitively
# covers every published artifact (issue #285).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
nfpms:
  - maintainer: 'Naohiro CHIKAMATSU <n.chika156@gmail.com>'
    description: 'Fast manager for Go-installed binaries in $GOBIN: update, export/import, and migrate toolsets across machines'
    homepage: https://github.com/nao1215/gup
    license: Apache License 2.0
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: ./completions/gup.bash
        dst: /usr/share/bash-completion/completions/gup
        file_info:
          mode: 0644
      - src: ./completions/gup.fish
        dst: /usr/share/fish/vendor_completions.d/gup.fish
        file_info:
          mode: 0644
      - src: ./completions/gup.zsh
        dst: /usr/share/zsh/vendor-completions/_gup
        file_info:
          mode: 0644
# winget distribution for Windows. `nao1215.gup` already exists in the community
# repository, but nothing here put it there: a third-party bot watches the
# releases and submits manifests when it gets around to it, which is why v1.5.1,
# v1.6.0, and v1.7.0 never reached winget at all and v1.8.0 arrived five days
# late carrying v1.7.1's release notes. Publishing from the release takes that
# over — the identifier is unchanged, so the next tag simply supersedes the
# bot's last submission, and the bot skips a version that is already there.
#
# The Windows archives are zips, which winget installs as a portable package, so
# no installer is built or signed. The manifests go to a branch on
# nao1215/winget-pkgs, a fork of the community repository, and the pull request
# is opened against microsoft/winget-pkgs. The publisher and description fields
# match what the package page already shows, so the takeover is not a visible
# change to anyone who has gup installed.
winget:
  - name: gup
    package_identifier: nao1215.gup
    publisher: Chikamatsu Naohiro
    publisher_url: "https://github.com/nao1215"
    publisher_support_url: "https://github.com/nao1215/gup/issues"
    author: Chikamatsu Naohiro
    homepage: "https://github.com/nao1215/gup"
    short_description: 'gup - Update binaries installed by "go install" with goroutines'
    description: |
      gup updates and manages the global Go command-line tools in $GOBIN.
      `go install` places each program there but never updates it again, keeps no
      manifest of what it installed, and offers no way to hold a tool at a
      version you depend on. gup brings the whole set up to date in parallel,
      pins selected tools to exact versions, and adds the management commands
      `go install` lacks: list and check what is installed, remove binaries,
      export and import the set to reproduce it on another machine, and migrate
      it to a new $GOBIN.
    license: Apache-2.0
    license_url: "https://github.com/nao1215/gup/blob/main/LICENSE"
    copyright: "Copyright (c) Chikamatsu Naohiro"
    copyright_url: "https://github.com/nao1215/gup/blob/main/LICENSE"
    release_notes_url: "https://github.com/nao1215/gup/releases/tag/{{ .Tag }}"
    tags:
      - cli-app
      - command-line-tool
      - cross-platform
      - go
      - golang
      - golang-tools
      - update
      - updater
      - user-friendly
    skip_upload: auto
    repository:
      owner: nao1215
      name: winget-pkgs
      branch: "gup-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
brews:
  - name: gup
    description: 'Fast manager for Go-installed binaries in $GOBIN: update, export/import, and migrate toolsets across machines'
    license: Apache License 2.0
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Ref. https://carlosbecker.com/posts/golang-completions-cobra/
    install: |-
      bin.install "gup"
      bash_completion.install "completions/gup.bash" => "gup"
      zsh_completion.install "completions/gup.zsh" => "gup"
      fish_completion.install "completions/gup.fish"    
