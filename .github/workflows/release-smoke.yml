name: Release Smoke

# Build the GoReleaser artifacts in snapshot mode (no publishing) and smoke-test
# them on every PR and push to main, so packaging, archive and manifest
# regressions are caught before a release is ever tagged.
#
# The artifacts are built once on Ubuntu and then handed to per-OS jobs. Building
# them is cross-compilation, so one runner can produce all six archives; RUNNING
# them is not, so the macOS and Windows binaries are executed on macOS and
# Windows runners. Without those legs, "the release works" would rest on Ubuntu
# having unpacked a file it cannot start.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts and smoke-test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Release artifacts are built with Go 1.27 (latest patch), not go.mod's
      # minimum, so the smoke job exercises exactly the toolchain release.yml
      # publishes with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      # Without rpm the .rpm check degrades to a magic-number test, which is not
      # what the release promises: the package's file tree is what a dnf user
      # gets. It is one apt package, so the full inspection runs instead.
      - name: Install rpm so the .rpm file tree can be inspected
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1

      - name: Build release artifacts (snapshot, no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Smoke-test artifacts
        run: ./scripts/smoke_artifacts.sh dist

      # Only what the per-OS jobs need: the archives and the manifests, not the
      # unpacked binaries GoReleaser also leaves in dist/.
      - name: Upload artifacts for the per-OS smoke jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/winget/**

  verify:
    name: Smoke-test artifacts on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go version -m reads the GOOS/GOARCH recorded inside each binary, which is
      # how the archives this runner cannot execute are still verified.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-snapshot
          path: dist

      # macOS is POSIX, so it runs the same script Ubuntu does; it executes the
      # darwin archive for its own architecture and skips the Linux package
      # inspection, which the Linux job already did.
      - name: Smoke-test the macOS artifacts
        if: runner.os == 'macOS'
        run: ./scripts/smoke_artifacts.sh dist

      # Windows deliberately does not run the bash script. A Windows check that
      # only passes because the runner image ships Git Bash is testing the image,
      # not gup, so the Windows leg is PowerShell end to end.
      - name: Smoke-test the Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_artifact.ps1 -DistDir dist
