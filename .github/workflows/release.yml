name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The publish job is gated on a full artifact smoke test, run on all three
  # operating systems. Building the artifacts is cross-compilation and happens on
  # one runner; running them is not, so the macOS and Windows binaries are
  # executed where they can be. A release that only ever unpacked its Windows zip
  # on Ubuntu has not been tested on Windows, and a broken artifact cannot be
  # taken back once the tag is published.
  smoke:
    name: Smoke-test artifacts on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Published binaries are built with the latest Go 1.27 patch release, the
      # newest toolchain gup supports, rather than go.mod's minimum (Go 1.26) -
      # users of a prebuilt artifact get the current runtime and its security
      # fixes even when they never install Go themselves.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true

      - name: Install rpm so the .rpm file tree can be inspected
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build artifacts for smoke test (snapshot, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Smoke-test artifacts
        run: ./scripts/smoke_artifacts.sh dist

      - name: Upload artifacts for the per-OS smoke jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/winget/**

  smoke-cross:
    name: Smoke-test artifacts on ${{ matrix.os }}
    needs: smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-snapshot
          path: dist

      - name: Smoke-test the macOS artifacts
        if: runner.os == 'macOS'
        run: ./scripts/smoke_artifacts.sh dist

      # PowerShell, not bash: see release-smoke.yml.
      - name: Smoke-test the Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_artifact.ps1 -DistDir dist

  release:
    name: Release
    needs: [smoke, smoke-cross]
    runs-on: ubuntu-latest
    outputs:
      # base64 of checksums.txt: the subjects the SLSA provenance job attests.
      hashes: ${{ steps.hash.outputs.hashes }}
    # id-token: keyless cosign signing + provenance via GitHub OIDC.
    # attestations: publish build provenance for the release artifacts.
    # contents: create the GitHub Release and upload assets.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Fork-scoped token so the winget manifests can be pushed to
          # nao1215/winget-pkgs and the pull request opened upstream.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail

          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"

  # SLSA build provenance as a release asset (multiple.intoto.jsonl). The GitHub
  # attestation above is kept, but it is not a release asset, so it is invisible
  # to anyone who only has the downloaded files and to OpenSSF Scorecard's
  # Signed-Releases check. The generator must be referenced by tag, not by
  # commit SHA: slsa-verifier checks the reusable workflow's ref.
  provenance:
    name: SLSA provenance
    needs: [release]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true # upload to the release goreleaser just created

  # Verify the published archives against the published provenance, the way a
  # user would, so a provenance that does not verify fails the release run.
  verification:
    name: Verify SLSA provenance
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install the verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.tar.gz" -p "*.zip"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$PROVENANCE"

      # checksums.txt also lists the .deb/.rpm/.apk packages and the SBOMs; only
      # the archives are downloaded above, so only they are verified here.
      - name: Verify assets
        env:
          CHECKSUMS: ${{ needs.release.outputs.hashes }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          checksums=$(echo "$CHECKSUMS" | base64 -d)
          while read -r _ fn; do
            case "$fn" in
              *.tar.gz|*.zip) ;;
              *) continue ;;
            esac
            echo "Verifying $fn"
            slsa-verifier verify-artifact --provenance-path "$PROVENANCE" \
                                          --source-uri "github.com/$GITHUB_REPOSITORY" \
                                          --source-tag "$GITHUB_REF_NAME" \
                                          "$fn"
          done <<<"$checksums"
