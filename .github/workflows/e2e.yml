name: E2E

# gup's offline end-to-end suite drives the real binary through atago against a
# self-contained module proxy. It used to run on Linux only, which left the two
# platforms where gup's behavior actually differs -- Windows' .exe suffix,
# %LOCALAPPDATA% config paths and PowerShell completion; macOS' own paths and
# man locations -- covered by unit tests alone.
#
# Every pull request runs all three operating systems. Linux and macOS run every
# spec; Windows runs the specs classified for it in e2e/os_matrix.tsv. The
# schedule stays because the suite drives the real Go toolchain and a real module
# proxy, so it can break without gup changing -- but it is a second signal, not
# the only one.
#
# The bootstrap is `go run ./e2e/runner`, not a shell script: the Windows leg
# must not depend on Git for Windows being installed, or it would be testing the
# runner image rather than gup.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC daily, ahead of the govulncheck scan.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: Offline E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Linux suite takes well under a minute; the cap is there so a hung
    # scenario -- a spec waiting on a prompt, a proxy that never binds -- fails
    # instead of burning a job's full six hours.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Every pull request runs all three. macOS was briefly a scheduled-only
        # drift check, on the theory that it is POSIX like Linux and would rarely
        # diverge -- which is a guess, and one that a spec table claiming macOS
        # coverage cannot be allowed to rest on. A leg that only runs after merge
        # tells you about a break when it is already on main.
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install atago
        uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          # v0.21.0 is the version the cross-platform specs were written and
          # verified against; the per-OS `skip:`/`only:` gates they use are
          # validated by its loader.
          version: v0.21.0

      # The runner picks the specs classified for this OS and prints how many of
      # the total it is running, so a shrunken leg is visible in the log rather
      # than silent.
      - name: Run offline end-to-end tests
        run: go run ./e2e/runner
