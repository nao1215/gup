name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build cache: these jobs compile with -race, which no other workflow does. With
# setup-go's shared cache, the E2E and coverage jobs on the same OS and Go patch
# save the key first, so every race build here started cold (about 95 s of
# compiling on Windows). Each leg keeps its own key instead, restored on every
# run and saved only from main, so pull requests cannot evict or poison it.
# The key is the Go patch and go.sum, not the commit: a per-commit key saved
# nine new entries on every push to main and filled the repository's 10 GB
# cache quota. main saves only when the exact key is missing, so each entry is
# refreshed when go.sum or the Go patch changes.
# The cache holds compiled packages only: -count=1 keeps go test from
# replaying a previous run's results, so every leg runs every test.
jobs:
  # Pinned toolchains: the Go versions gup promises to keep working on. Every
  # supported minor gets its own leg on all three OSes, so dropping support for
  # one is a deliberate edit here rather than an accident. Keep this list in sync
  # with the "Supported Go versions" section of README.md and
  # website/content/install.md.
  unit_test:
    name: Unit test (${{ matrix.os }}, Go ${{ matrix.go }})

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        go:
          - "1.26"
          - "1.27"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Locate Go caches
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-unit-race-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-unit-race-${{ steps.go.outputs.go-version }}-

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Latest Go: a separate, explicitly named job rather than a "1" entry hidden in
  # the matrix above, so a failure says whether gup broke on a version it
  # supports today or on the toolchain that is about to become one. check-latest
  # forces the newest released patch instead of whatever the runner image caches.
  unit_test_latest_go:
    name: Unit test (${{ matrix.os }}, latest Go)

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Locate Go caches
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # The pinned 1.27 leg and this one may resolve to the same patch; the
      # "latest" part of the key keeps them from saving over each other.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ runner.os }}-unit-race-latest-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-unit-race-latest-${{ steps.go.outputs.go-version }}-

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
