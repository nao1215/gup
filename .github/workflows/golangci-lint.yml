name: golangci-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci-lint:
    # A linter only sees the files that build for its GOOS, so the systems
    # gup has code for are each their own leg. The BSDs reach gup through
    # cmd/bug_report_nobrowser.go and the !windows halves of cmd and
    # internal/lockfile, which nothing compiled until they were listed
    # here. Cross-compiling costs seconds and the repository is public, so
    # every leg runs on every change.
    name: golangci-lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd, netbsd]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The linter's toolchain is bounded by the linter, not by gup's policy. A
      # released golangci-lint binary embeds the go/types of the Go it was built
      # with, and type-checking a NEWER standard library makes it panic with
      # "file requires newer Go version go1.27 (application built with go1.26)"
      # -- so pointing this job at the Go 1.27 release toolchain took the linter
      # out entirely. It stays on the module minimum; the newer toolchains are
      # covered by unit_test.yml, which compiles and runs the code rather than
      # analyzing it.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Run golangci-lint as an enforced gate
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
