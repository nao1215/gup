# Version updates arrive once a month, one pull request per ecosystem.
# Each group applies to version updates only. Security updates are switched on
# in the repository settings, not here; where they are on, Dependabot opens
# them one by one as advisories appear, outside this schedule and these groups.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
