# Version updates arrive once a month, one pull request per ecosystem.
# Each group applies to version updates only, so security updates are not
# grouped or delayed: Dependabot opens them as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
